<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="icon" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TravelEase- Travel And Tourism</title>
    
    <!-- THE ABSOLUTE INTERCEPTOR: Runs synchronously before React/Redux/Axios -->
    <script>
      (function() {
        const RENDER_URL = "https://travelease-backend-mwq0.onrender.com";
        
        // 1. Lock down standard Fetch (catches RTK Query and normal fetches)
        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
          let [resource, config] = args;
          if (typeof resource === 'string') {
            if (resource.startsWith('/api/')) resource = RENDER_URL + resource;
            else if (resource.includes('localhost:8000') || resource.includes('/undefined/api/')) {
              resource = resource.replace(/http:\/\/localhost:8000|.*\/undefined\/api\//g, RENDER_URL + (resource.includes('/api/') ? '' : '/api/'));
            }
          }
          return originalFetch(resource, config);
        };

        // 2. Lock down XHR (catches Axios)
        const originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url, ...rest) {
          if (typeof url === 'string') {
            if (url.startsWith('/api/')) url = RENDER_URL + url;
            else if (url.includes('localhost:8000') || url.includes('/undefined/api/')) {
              url = url.replace(/http:\/\/localhost:8000|.*\/undefined\/api\//g, RENDER_URL + (url.includes('/api/') ? '' : '/api/'));
            }
          }
          return originalOpen.call(this, method, url, ...rest);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
